version: 2

models:
  - name: stg_customers
    description: "Dados de clientes limpos e normalizados para uso em camadas downstream."
    columns:
      - name: customer_id
        description: "Identificador único do cliente."
        tests:
          - unique
          - not_null
      - name: name
        description: "Nome completo do cliente."
        tests:
          - not_null
      - name: email
        description: "E-mail do cliente."
        tests:
          - unique
          - not_null
      - name: created_at
        description: "Data de criação da conta do cliente."
        tests:
          - not_null

  - name: stg_orders
    description: "Dados de pedidos padronizados e prontos para joins com clientes e itens."
    columns:
      - name: order_id
        description: "Identificador único do pedido."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Chave do cliente relacionado ao pedido."
        tests:
          - not_null
      - name: order_date
        description: "Data do pedido."
        tests:
          - not_null
      - name: status
        description: "Status atual do pedido."
        tests:
          - not_null

  - name: stg_order_items
    description: "Itens de pedidos com quantidade e preço unitário."
    columns:
      - name: order_item_id
        description: "Identificador único do item do pedido."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Pedido ao qual o item pertence."
        tests:
          - not_null
      - name: product_id
        description: "Produto vinculado ao item."
        tests:
          - not_null
      - name: quantity
        description: "Quantidade de unidades do item."
        tests:
          - not_null
      - name: unit_price
        description: "Preço unitário no momento do pedido."
        tests:
          - not_null

  - name: stg_products
    description: "Dados de produtos limpos e normalizados para uso em dimensões e fatos."
    columns:
      - name: product_id
        description: "Identificador único do produto."
        tests:
          - unique
          - not_null
      - name: product
        description: "Nome do produto."
        tests:
          - not_null
      - name: category
        description: "Categoria do produto."
        tests:
          - not_null
      - name: price
        description: "Preço do produto."
        tests:
          - not_null