version: 2

models:
  - name: int_dim_customers
    description: "Dimensão intermediária de clientes com atributos baseados em staging."
    columns:
      - name: id
        description: "Identificador do cliente."
        tests:
          - unique
          - not_null
      - name: name
        description: "Nome completo do cliente."
      - name: email
        description: "E-mail do cliente."
      - name: first_login
        description: "Data de criação da conta do cliente."

  - name: int_dim_products
    description: "Dimensão intermediária de produtos com atributos de catálogo."
    columns:
      - name: id
        description: "Identificador do produto."
        tests:
          - unique
          - not_null
      - name: product
        description: "Nome do produto."
      - name: category
        description: "Categoria do produto."
      - name: price
        description: "Preço unitário do produto."

  - name: int_fct_sales
    description: "Tabela intermediária de fatos de vendas, com dados enriquecidos de cliente, pedido e produto."
    columns:
      - name: order_id
        description: "Identificador do pedido."
      - name: product_id
        description: "Produto relacionado à venda."
      - name: customer_id
        description: "Cliente relacionado à venda."
      - name: sell_date
        description: "Data da venda."
      - name: quantity
        description: "Quantidade vendida do item."
      - name: price
        description: "Preço unitário do item."
      - name: total_amount
        description: "Valor total do item calculado pela quantidade multiplicada pelo preço."

  - name: int_customer_metrics
    description: "Métricas agregadas por cliente calculadas a partir do fato de vendas."
    columns:
      - name: id
        description: "Identificador do cliente."
        tests:
          - unique
          - not_null
      - name: orders
        description: "Quantidade total de pedidos do cliente."
      - name: items_bought
        description: "Total de itens comprados pelo cliente."
      - name: total_spent
        description: "Valor total gasto pelo cliente."
      - name: average_ticket
        description: "Ticket médio por pedido do cliente."

  - name: int_product_performance
    description: "Métricas agregadas por produto para análise de performance."
    columns:
      - name: product_id
        description: "Identificador do produto."
      - name: product
        description: "Nome do produto."
      - name: category
        description: "Categoria associada ao produto."
      - name: units_sold
        description: "Quantidade total de unidades vendidas."
      - name: revenue
        description: "Receita total gerada pelo produto."

  - name: int_sales_summary
    description: "Resumo mensal de vendas e receita por período."
    columns:
      - name: month
        description: "Mês da agregação no formato YYYY-MM."
      - name: orders
        description: "Número de pedidos no mês."
      - name: items_sold
        description: "Quantidade total de itens vendidos no mês."
      - name: revenue
        description: "Receita total do mês."
      - name: average_ticket
        description: "Ticket médio por pedido no mês."