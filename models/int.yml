version: 2

models:
  - name: int_customers
    description: "Tabela intermediária de clientes. Aplica transformações e enriquecimentos adicionais aos dados de staging. Materializado como INCREMENTAL para otimizar atualizações incrementais."
    columns:
      - name: customer_id
        description: "Identificador único do cliente"
        tests:
          - not_null
      - name: name
        description: "Nome completo do cliente"
      - name: email
        description: "Email do cliente"
      - name: created_at
        description: "Data de criação da conta"

  - name: int_order_details
    description: "Tabela intermediária que enriquece os itens de pedidos com dados de clientes e produtos. Realiza joins complexos entre múltiplas tabelas de staging e calcula totais por item. Materializado como INCREMENTAL."
    columns:
      - name: order_id
        description: "Identificador do pedido"
      - name: product_id
        description: "Identificador do produto"
      - name: customer_id
        description: "Identificador do cliente"
      - name: name
        description: "Nome do cliente"
      - name: product
        description: "Nome do produto"
      - name: category
        description: "Categoria do produto"
      - name: quantity
        description: "Quantidade de unidades"
      - name: price
        description: "Preço unitário do produto"
      - name: total
        description: "Total = quantidade * preço (agregado)"
      - name: sell_date
        description: "Data da venda (renomeado de order_date)"

  - name: int_products
    description: "Tabela intermediária de produtos. Aplica transformações aos dados de staging de produtos. Materializado como INCREMENTAL."
    columns:
      - name: product_id
        description: "Identificador único do produto"
        tests:
          - not_null
      - name: product
        description: "Nome do produto"
      - name: category
        description: "Categoria do produto"
      - name: price
        description: "Preço do produto"