version: 2

models:
  - name: dim_customers
    description: "Dimensão final de clientes para análise comercial e segmentação."
    columns:
      - name: id
        description: "Identificador do cliente."
        tests:
          - unique
          - not_null
      - name: name
        description: "Nome completo do cliente."
      - name: email
        description: "E-mail do cliente."
      - name: first_login
        description: "Data de criação da conta do cliente."

  - name: dim_products
    description: "Dimensão final de produtos para análise de catálogo e performance comercial."
    columns:
      - name: id
        description: "Identificador do produto."
        tests:
          - unique
          - not_null
      - name: product
        description: "Nome do produto."
      - name: category
        description: "Categoria do produto."
      - name: price
        description: "Preço unitário do produto."

  - name: fct_sales
    description: "Tabela de fatos final com o detalhamento de vendas por item de pedido."
    columns:
      - name: order_id
        description: "Identificador do pedido."
      - name: product_id
        description: "Produto vendido."
      - name: customer_id
        description: "Cliente que realizou a compra."
      - name: sell_date
        description: "Data da venda."
      - name: quantity
        description: "Quantidade vendida."
      - name: price
        description: "Preço unitário do item."
      - name: total_amount
        description: "Valor total do item."

  - name: customer_metrics
    description: "Métricas agregadas por cliente para análise de comportamento e retenção."
    columns:
      - name: id
        description: "Identificador do cliente."
        tests:
          - unique
          - not_null
      - name: orders
        description: "Total de pedidos do cliente."
      - name: items_bought
        description: "Total de itens comprados."
      - name: total_spent
        description: "Valor total gasto pelo cliente."
      - name: average_ticket
        description: "Ticket médio por pedido."

  - name: product_performance
    description: "Métricas agregadas por produto para análise de performance comercial."
    columns:
      - name: product_id
        description: "Identificador do produto."
      - name: product
        description: "Nome do produto."
      - name: category
        description: "Categoria do produto."
      - name: units_sold
        description: "Quantidade total vendida."
      - name: revenue
        description: "Receita total do produto."

  - name: sales_summary
    description: "Resumo mensal de vendas para monitoramento de KPIs e tendências."
    columns:
      - name: month
        description: "Mês da agregação no formato YYYY-MM."
      - name: orders
        description: "Número de pedidos do mês."
      - name: items_sold
        description: "Quantidade total de itens vendidos."
      - name: revenue
        description: "Receita total do mês."
      - name: average_ticket
        description: "Ticket médio por pedido no mês."