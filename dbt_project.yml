# =============================================================================
# dbt Ecommerce Analytics - Project Configuration
# =============================================================================
# Nome do projeto dbt
name: 'dbt_ecommerce_analytics'
version: '1.0.0'

# Profile usado para conectar ao banco de dados (definido em ~/.dbt/profiles.yml)
profile: 'dbt_ecommerce_analytics'

# Modelo de controle de versão (optional)
config-version: 2

# =============================================================================
# Paths - Onde encontrar diferentes tipos de arquivos
# =============================================================================
model-paths: ["models"]           # Modelos SQL e YAML
analysis-paths: ["analyses"]      # Análises ad-hoc
test-paths: ["tests"]             # Testes customizados
seed-paths: ["seeds"]             # Dados CSV para carregar
macro-paths: ["macros"]           # Macros reutilizáveis
snapshot-paths: ["snapshots"]     # Snapshots (SCD)

# =============================================================================
# Clean Targets - Diretórios removidos ao executar 'dbt clean'
# =============================================================================
clean-targets:
  - "target"
  - "dbt_packages"

# =============================================================================
# Configuração de Modelos
# =============================================================================
# Documentação completa: https://docs.getdbt.com/docs/configuring-models

models:
  dbt_ecommerce_analytics:
    # =========================================================================
    # STAGING - Modelos de limpeza e validação (primeira camada)
    # =========================================================================
    stg:
      +materialized: table        # Usar TABLE para melhor performance
      +schema: transacoes         # Schema separado no banco
      +tags: ["staging"]          # Tags para filtragem
      +docs:
        show: true                # Mostrar na documentação

    # =========================================================================
    # INTERMEDIATE - Transformações complexas (segunda camada)
    # =========================================================================
    int:
      +materialized: incremental  # Usar INCREMENTAL para otimizar
      +schema: transacoes
      +tags: ["intermediate"]
      +docs:
        show: true

    # =========================================================================
    # FINAL - Modelos analíticos prontos para BI (terceira camada)
    # =========================================================================
    final:
      +schema: transacoes
      +tags: ["final"]
      +docs:
        show: true

      # Dimensions
      dimensions:
        +materialized: table
        +tags: ["dimension"]

      # Facts
      facts:
        +materialized: table
        +tags: ["fact"]

      # Analytics/Reporting
      analytcs:
        +materialized: view
        +tags: ["analytics", "reporting"]

# =============================================================================
# Seed Configurations - Configurações para dados CSV
# =============================================================================
seeds:
  dbt_ecommerce_analytics:
    +schema: raw                  # Schema para dados brutos
    +tags: ["seed"]

# =============================================================================
# Vars - Variáveis globais que podem ser usadas nos modelos
# =============================================================================
vars:
  'start_date': '2023-01-01'      # Data de início para filtros
  'key_date': '{{ run_started_at.strftime("%Y-%m-%d") }}'  # Data da execução

# =============================================================================
# Require dbt Version - Versão mínima do dbt necessária
# =============================================================================
require-dbt-version: [">=1.0.0"]

# =============================================================================
# Flags - Comportamento global do dbt
# =============================================================================
flags:
  static_parser: false            # Parser estático (experimental)
  send_anonymous_usage_stats: true # Compartilhar estatísticas anônimas
